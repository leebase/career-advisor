# Builds and runs the app with no dependency beyond this repository.
#
# The app starts and serves without an LLM provider; interviews need one.
# Point CAREER_ADVISOR_LLM_PROVIDER at any callable matching
# `complete(prompt) -> str` (see README.md), e.g.
#
#   environment:
#     CAREER_ADVISOR_LLM_PROVIDER: "myproject.provider:complete"
#
# Your provider's own package and credentials are yours to mount or install —
# put that, and anything else specific to your deployment, in
# docker-compose.override.yml, which Compose merges automatically and this
# repository ignores.
services:
  career-advisor:
    build:
      context: .
      target: app
    container_name: career-advisor
    ports:
      - "127.0.0.1:8611:8611"
      # docker-bridge gateway binding: lets a separate nginx container reach
      # the app via host.docker.internal (host-gateway) without LAN exposure.
      # Drop this line if you are not proxying from another compose stack.
      - "172.17.0.1:8611:8611"
    volumes:
      # SQLite lives here: invites, sessions, profile facts, documents.
      - ./data:/data
    restart: unless-stopped
