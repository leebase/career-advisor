# Drop-in replacement for the stock nginx default.conf in the shared
# webroot stack. Keeps the static webroot behavior and adds a reverse
# proxy for the Career Advisor app container (published on host :8611).
#
# Wire-up (in the nginx service of whichever compose stack serves the webroot):
#
#   volumes:
#     - .:/usr/share/nginx/html:ro
#     - /path/to/career-advisor/deploy/webroot-default.conf:/etc/nginx/conf.d/default.conf:ro
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
#
# Then: docker compose up -d   (recreates nginx with the new conf)
#
# Note: host-gateway cannot reach a loopback-only bind, so the app must also
# publish on the docker bridge gateway (see docker-compose.yml) — or you can
# join both stacks to a shared docker network instead.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /career-advisor/ {
        proxy_pass http://host.docker.internal:8611;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
