[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-advisor"
version = "0.1.0"
description = "Interview-driven career profile builder: evidenced facts in, resume and job-search strategy out"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lee Harrington"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
career-advisor = "career_advisor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
career_advisor = [
    "templates/*.html",
    "static/*.css",
    "schemas/*.yaml",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
